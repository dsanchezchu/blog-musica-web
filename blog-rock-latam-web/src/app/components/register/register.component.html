<main class="wrapper min-vh-100 d-flex justify-content-center align-items-center">
    <div class="form-register p-4 border rounded">
      <div class="d-flex justify-content-center mb-4">
        <img src="assets/images/logo/logo-rock.png" alt="Logo" width="60" height="60" class="d-inline-block me-3">
      </div>
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="row g-3">
        <div class="col-10">
          <div class="row">
            <div class="col-md-6 campo p-2">
              <i class="bi bi-person"></i>
              <input type="text" formControlName="first_name" class="form-control kanit-regular" placeholder="Primer Nombre">
              <div *ngIf="errors.first_name" class="text-danger">{{ errors.first_name[0] }}</div>
            </div>
            <div class="col-md-6 campo p-2">
              <i class="bi bi-person"></i>
              <input type="text" formControlName="last_name" class="form-control kanit-regular" placeholder="Segundo Nombre">
              <div *ngIf="errors.last_name" class="text-danger">{{ errors.last_name[0] }}</div>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6 campo p-2">
              <i class="bi bi-envelope-at"></i>
              <input type="email" formControlName="email" class="form-control kanit-regular" placeholder="Correo">
              <div *ngIf="errors.email" class="text-danger">{{ errors.email[0] }}</div>
            </div>
            <div class="col-md-6 campo p-2">
              <i class="bi bi-telephone"></i>
              <input type="text" formControlName="phone_number" class="form-control kanit-regular" placeholder="Número de Teléfono">
              <div *ngIf="errors.phone_number" class="text-danger">{{ errors.phone_number[0] }}</div>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6 campo p-2">
              <i class="bi bi-key"></i>
              <input type="password" formControlName="password" class="form-control kanit-regular" placeholder="Contraseña">
              <div *ngIf="errors.password" class="text-danger">{{ errors.password[0] }}</div>
            </div>
          </div>
          <div class="row">
            <div class="col-md-12 campo p-2">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="gridCheck">
                <label class="form-check-label kanit-extralight" for="gridCheck">
                  Check me out
                </label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-2">
          <div class="row-md-4 pt-1">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="gridCheck">
              <label class="form-check-label kanit-extralight" for="gridCheck">
                Check me out
              </label>
            </div>
          </div>
          <div class="row-md-4">
            <button type="submit" class="btn btn-outline-warning" [disabled]="registerForm.invalid">
              <span class="kanit-light">Registrarse</span>
            </button>
          </div>
          <div class="row-md-4 mt-2">
            <div class="alert alert-primary fsn" role="alert">
              La contraseña debe tener al menos 8 caracteres.
            </div>
          </div>
        </div>
      </form>
    </div>
  </main>
